# nginx site config for Cemented.
#
# Single-domain setup: nginx serves the React SPA and the static/media files
# directly, and reverse-proxies only the dynamic routes (/api/, /admin/) to
# Gunicorn. One origin for everything means no CORS and no cross-site cookie
# problems for the session-auth SPA.
#
# Install on the Droplet:
#   sudo cp deploy/nginx-cemented.conf /etc/nginx/sites-available/cemented
#   sudo ln -s /etc/nginx/sites-available/cemented /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default     # remove the welcome page
#   sudo nginx -t                                   # test config syntax
#   sudo systemctl reload nginx
#   sudo certbot --nginx -d cemented.band -d www.cemented.band
#
# certbot rewrites this file in place: it adds a `listen 443 ssl` server block
# with the certificate paths and turns the block below into an HTTP->HTTPS
# redirect. So this file is the "before TLS" version — run certbot last.
#
# Replace cemented.band and every /home/cemented/... path to match your setup.

server {
    listen 80;
    listen [::]:80;
    server_name cemented.band www.cemented.band;

    # Product-image uploads via the Django admin (nginx default cap is 1M).
    client_max_body_size 15M;

    # React build output from `npm run build` (Vite writes to frontend/dist).
    root /home/cemented/Web-Cemented/frontend/dist;
    index index.html;

    # Django's collected static files (admin + DRF CSS/JS), produced by
    # `manage.py collectstatic`. STATIC_ROOT in settings = backend/staticfiles.
    location /static/ {
        alias /home/cemented/Web-Cemented/backend/staticfiles/;
        access_log off;
        expires 30d;
    }

    # Uploaded media (product images), stored on the DigitalOcean Volume that
    # DJANGO_MEDIA_ROOT points at. Survives droplet/app rebuilds.
    location /media/ {
        alias /mnt/cemented_media/;
        access_log off;
        expires 30d;
    }

    # Dynamic routes -> Gunicorn (the systemd service binds 127.0.0.1:8000).
    # `proxy_params` (ships with Ubuntu's nginx) forwards Host, X-Real-IP,
    # X-Forwarded-For and — crucially — X-Forwarded-Proto, which prod.py's
    # SECURE_PROXY_SSL_HEADER relies on to know the request arrived over HTTPS.
    # If `nginx -t` ever complains that proxy_params is missing, replace the
    # include with these four lines:
    #   proxy_set_header Host $http_host;
    #   proxy_set_header X-Real-IP $remote_addr;
    #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #   proxy_set_header X-Forwarded-Proto $scheme;
    location /api/ {
        include proxy_params;
        proxy_pass http://127.0.0.1:8000;
    }
    location /admin/ {
        include proxy_params;
        proxy_pass http://127.0.0.1:8000;
    }

    # SPA client-side routing: any path that isn't a real file falls back to
    # index.html so React Router (or direct deep links) work on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
