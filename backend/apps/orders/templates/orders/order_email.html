<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ heading }}</title>
</head>
<body style="margin:0; padding:0; background-color:#0a0a0a; font-family:'Inter', system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#e7e2d6;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0a0a0a;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%; background-color:#161616; border:1px solid #2a2a2a;">

          <tr>
            <td style="padding:32px 32px 24px 32px; border-bottom:1px solid #2a2a2a;">
              <div style="font-size:24px; font-weight:800; text-transform:uppercase; letter-spacing:0.08em; color:#e7e2d6;">Cemented</div>
              <div style="width:56px; height:5px; background-color:#a81d1d; margin-top:10px; font-size:0; line-height:0;">&nbsp;</div>
            </td>
          </tr>

          <tr>
            <td style="padding:32px;">
              <h1 style="margin:0 0 8px 0; font-size:20px; font-weight:700; color:#e7e2d6;">{{ heading }}</h1>
              <p style="margin:0 0 28px 0; font-size:15px; line-height:1.6; color:#9a958c;">{{ intro }}</p>

              <div style="font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:#9a958c; margin-bottom:8px;">Order #{{ order.id }}</div>

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                {% for item in items %}
                <tr>
                  <td style="padding:12px 0; border-bottom:1px solid #2a2a2a; font-size:15px; color:#e7e2d6;">{{ item.quantity }} &times; {{ item.name }}</td>
                  <td style="padding:12px 0; border-bottom:1px solid #2a2a2a; font-size:15px; color:#e7e2d6; text-align:right; white-space:nowrap;">${{ item.line_total }}</td>
                </tr>
                {% endfor %}
                <tr>
                  <td style="padding:18px 0 0 0; font-size:16px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:#e7e2d6;">Total</td>
                  <td style="padding:18px 0 0 0; font-size:16px; font-weight:700; color:#c0241f; text-align:right; white-space:nowrap;">${{ order.total }}</td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td style="padding:24px 32px; border-top:1px solid #2a2a2a; font-size:12px; line-height:1.5; color:#9a958c;">
              Cemented &mdash; thanks for the support.
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
